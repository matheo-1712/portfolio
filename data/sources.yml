# Ou le collecteur va chercher les projets.

github:
  # Un repo n'est retenu que s'il porte ce topic OU un fichier portfolio.md.
  topic: "portfolio"
  users:
    - "matheo-1712"
  orgs:
    - "L-Antre-des-Loutres"
  # Inclus d'office, meme sans topic ni portfolio.md.
  # Pratique pour demarrer avant d'avoir tague les repos sur GitHub.
  include:
    - "matheo-1712/OAPI"
    - "matheo-1712/Citlali"
    - "matheo-1712/CitlAPI"
    - "matheo-1712/RustSSH"
    - "matheo-1712/cobblemon-trainers"
    - "matheo-1712/re-otterbots"
    - "L-Antre-des-Loutres/Otterbots"
    - "L-Antre-des-Loutres/Arisoutre"
    - "L-Antre-des-Loutres/Astroloutre"
    - "L-Antre-des-Loutres/Mateloutre"
    - "L-Antre-des-Loutres/Ottergames-plugin"
    - "L-Antre-des-Loutres/OtterMinded"
    - "L-Antre-des-Loutres/OtterlyApi"
    - "L-Antre-des-Loutres/Cobblemon-RLM"
    - "matheo-1712/Furina"
    - "matheo-1712/API-Serveur"
    - "matheo-1712/ArisoutreV2"
    - "LP-Applications-Web-Angers-2025-2026/HiddenInk"
    - "LP-Applications-Web-Angers-2025-2026/projet2"
    - "L-Antre-des-Loutres/Olderisoutre"
    - "L-Antre-des-Loutres/Oldisoutre"
    - "albanPouch/GestaBox"

  # Ne retenir que les depots ou l'une des identites ci-dessous a reellement
  # commite. Figurer dans une organisation ne vaut pas contribution.
  # Laisse la liste vide pour reprendre `users` comme identites.
  requireContribution: true
  minCommits: 1
  identities:
    - "matheo-1712"

  # Ignores meme s'ils portent le topic.
  exclude:
    - "matheo-1712/portfolio"
    - "matheo-1712/portfolio_old"
    - "matheo-1712/matheo-1712"

pocketbase:
  enabled: true
  url: "https://pocketbase.antredesloutres.fr"
  collection: "projects"
  # Laisse vide si la regle de list de la collection est publique.
  # Sinon, renseigne les secrets PB_EMAIL / PB_PASSWORD dans GitHub Actions.
  auth: env
  # Un projet PocketBase est ignore si son repo est deja collecte via GitHub.
  # Le rapprochement se fait sur le champ repository, sinon sur le slug du nom.

# Verifie que les URLs declarees par les projets repondent encore.
# Les plateformes tierces (Discord, Modrinth, GitHub) ne sont jamais testees :
# leur disponibilite ne dit rien de ton infrastructure.
healthcheck:
  enabled: true

# Recupere les captures d'ecran, l'icone et les telechargements des projets
# publies sur Modrinth. Le lien est detecte dans les liens du projet, ou
# declare avec `modrinth: <slug>` dans son portfolio.md.
modrinth:
  enabled: true
