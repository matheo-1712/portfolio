# Corrections manuelles, appliquees APRES toutes les autres sources.
# Cle = "owner/repo" en minuscules, ou le slug du projet PocketBase.
#
# Champs disponibles :
#   title, summary, type, stack[], status (prod|wip|archived|paused),
#   started, ended, featured (bool), order (int), links{}, hidden (bool),
#   alias_of ("owner/repo" — fusionne ce projet dans un autre)
#
# Exemple :
# matheo-1712/re-otterbots:
#   alias_of: "l-antre-des-loutres/otterbots"
#
# l-antre-des-loutres/otterbots:
#   featured: true
#   order: 2
#   summary: "Framework Discord modulaire qui propulse quatre bots en production."

matheo-1712/re-otterbots:
  alias_of: "l-antre-des-loutres/otterbots"

matheo-1712/arisoutrev2:
  alias_of: "l-antre-des-loutres/arisoutre"

matheo-1712/api-serveur:
  alias_of: "l-antre-des-loutres/otterlyapi"

matheo-1712/otterlyapi:
  alias_of: "l-antre-des-loutres/otterlyapi"

# L'API est citee dans le README d'OtterlyApi mais n'etait declaree nulle part :
# sans URL declaree, aucune verification de disponibilite n'est possible.
l-antre-des-loutres/otterlyapi:
  links:
    demo: "https://api.antredesloutres.fr/"

# Galerie declaree a la main : les chemins sont relatifs a static/.
# Elle est prioritaire sur une galerie recuperee depuis Modrinth.
l-antre-des-loutres/otterminded:
  gallery:
    - url: "img/shots/otterminded/accueil.webp"
      title: "Page d'accueil de l'application (mode clair)"
    - url: "img/shots/otterminded/navbar.webp"
      title: "Menu de navigation de l'application"
    - url: "img/shots/otterminded/profil.webp"
      title: "Page profil de l'application"
    - url: "img/shots/otterminded/adminpanel_commentaire.webp"
      title: "Page commentaire sur le panel Admin"
    - url: "img/shots/otterminded/adminpanel_question.webp"
      title: "Page question sur le panel admin"
    - url: "img/shots/otterminded/adminpanel_utilisateur.webp"
      title: "Page utilisateur sur le panel admin"

matheo-1712/citlali:
  gallery:
    - url: "img/shots/citlali/infographies.webp"
      title: "Commande /build [nom du personnage]"
    - url: "img/shots/citlali/autocompletion.webp"
      title: "Système d'autocomplétion"
    - url: "img/shots/citlali/profil.webp"
      title: "Profil de l'utilisateur via la commande /get-uid"
